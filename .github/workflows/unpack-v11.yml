name: V16 retention and re-engagement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V16 retention patch
        run: python .github/scripts/v16_patch.py

      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          js = m.group(1)
          required = ['initReturnExperience','return_visit','resume_shortlist','recent_name_revisited','omReturningVisitors']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V16 pieces: {missing}')
          Path('/tmp/ntb.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/ntb.js

      - name: Commit V16 retention experience
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add retention and re-engagement experience"
          git push
