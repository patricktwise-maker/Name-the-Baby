name: V18 sponsor and affiliate readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monetization_readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V18 monetization patch
        run: python .github/scripts/v18_patch.py

      - name: Validate V18 browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          required = [
              'V18 sponsor-and-affiliate-ready one-page build',
              'get_partner_offer',
              'partner_impression',
              'partner_click',
              'rel="sponsored noopener noreferrer"',
              'Affiliate disclosure:',
              'get_owner_monetization',
              'id="omPartnerCtr"'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V18 pieces: {missing}')
          PY
          node --check /tmp/ntb.js

      - name: Commit V18 monetization readiness
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add sponsor and affiliate monetization readiness"
          git push
