name: V19.2 one-page SEO intent navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo_ranking_readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve V18 monetization readiness
        run: python .github/scripts/v18_patch.py

      - name: Preserve Impact website verification
        run: python .github/scripts/impact_verify.py

      - name: Preserve strict generator filters
        run: python .github/scripts/v18_2_filter_integrity.py

      - name: Preserve V19.1 SEO ranking work
        run: python .github/scripts/v19_seo_ranking.py

      - name: Apply V19.2 SEO intent navigation
        run: python .github/scripts/v19_2_seo_intent_nav.py

      - name: Validate browser JavaScript and SEO integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          required = [
              'V18 sponsor-and-affiliate-ready one-page build',
              "<meta name='impact-site-verification' value='9370d4fd-1b03-442a-844d-163db085d91f'>",
              'V18.2 strict generator filter integrity',
              'V19.1 SEO: verified crawlable catalog examples + intent coverage',
              'V19.2 SEO: descriptive intent navigation + internal discovery links',
              'https://www.namethebaby.site/',
              'Boy, girl & unisex names',
              'Names by origin',
              'Names A–Z',
              'Unique & distinctive names',
              'Names with meanings',
              'Use the baby name generator with these filters',
              '"@type": "WebApplication"'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V19.2 pieces: {missing}')
          if '<link rel="canonical" href="https://namethebaby.site/"' in text:
              raise SystemExit('Old non-www canonical remains')
          if 'potentialAction' in text or 'SearchAction' in text:
              raise SystemExit('Do not claim a URL search endpoint that does not exist')
          PY
          node --check /tmp/ntb.js

      - name: Commit SEO ranking improvements
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve one-page SEO intent navigation"
          git push
