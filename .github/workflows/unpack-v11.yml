name: V17 Google SEO and discoverability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  google_discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply V17 Google discovery patch
        run: python .github/scripts/v17_patch.py

      - name: Validate SEO and browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          required = [
              'Baby Name Generator, Creator & Family Poll | Name the Baby',
              'application/ld+json',
              '"@type": "WebSite"',
              'id="babyNameTools"',
              'Baby name generator',
              'Family baby name poll'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V17 SEO pieces: {missing}')
          ET.parse('sitemap.xml')
          robots = Path('robots.txt').read_text(encoding='utf-8')
          if 'Sitemap: https://namethebaby.site/sitemap.xml' not in robots:
              raise SystemExit('robots.txt does not advertise sitemap')
          PY
          node --check /tmp/ntb.js

      - name: Commit V17 Google discovery
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Google SEO and search discovery foundation"
          git push

# V17 retry after validation-guard correction
