name: Switch production branding to namethebaby.site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  custom_domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make namethebaby.site the public domain
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          changed = False

          old_domain = 'https://name-the-baby-tlae.vercel.app'
          new_domain = 'https://namethebaby.site'
          if old_domain in text:
              text = text.replace(old_domain, new_domain)
              changed = True

          marker = 'const DEFAULT_PAGE_TITLE="Name the Baby";'
          public_origin = 'const PUBLIC_SITE_ORIGIN="https://namethebaby.site";\n'
          if 'const PUBLIC_SITE_ORIGIN=' not in text and marker in text:
              text = text.replace(marker, public_origin + marker, 1)
              changed = True

          old_return = 'return `${u.origin}${u.pathname}${qs?`?${qs}`:""}`;'
          new_return = 'return `${PUBLIC_SITE_ORIGIN}${u.pathname}${qs?`?${qs}`:""}`;'
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
              changed = True

          if old_domain in text:
              raise RuntimeError('Old Vercel public domain still remains in index.html')
          if 'https://namethebaby.site' not in text:
              raise RuntimeError('Custom domain was not written to index.html')

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Custom domain migration applied.')
          else:
              print('No changes needed.')

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/ntb.js

      - name: Commit custom-domain migration
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use namethebaby.site as public domain"
          git push
