name: V18.1 Impact website verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  impact_verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve V18 monetization readiness
        run: python .github/scripts/v18_patch.py

      - name: Add Impact verification tag
        run: python .github/scripts/impact_verify.py

      - name: Validate browser JavaScript and Impact tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          required = [
              'V18 sponsor-and-affiliate-ready one-page build',
              "<meta name='impact-site-verification' value='9370d4fd-1b03-442a-844d-163db085d91f'>",
              'get_partner_offer',
              'partner_impression',
              'partner_click'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V18.1 pieces: {missing}')
          PY
          node --check /tmp/ntb.js

      - name: Commit Impact verification
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Impact website verification tag"
          git push
