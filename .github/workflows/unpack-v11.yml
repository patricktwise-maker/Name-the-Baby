name: Fix V11 startup JavaScript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard removed sponsor button listener
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '$("sponsorBtn").addEventListener("click",()=>{openModal("sponsorModal");logEvent("sponsor_opened",{});});'
          new = 'if($("sponsorBtn"))$("sponsorBtn").addEventListener("click",()=>{openModal("sponsorModal");logEvent("sponsor_opened",{});});'

          if old not in text:
              print('Old sponsor listener not found; patch may already be applied.')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Patched startup listener.')

      - name: Commit startup fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix V11 ballot startup"
          git push
