name: V18.2 strict generator filters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strict_generator_filters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve V18 monetization readiness
        run: python .github/scripts/v18_patch.py

      - name: Preserve Impact website verification
        run: python .github/scripts/impact_verify.py

      - name: Apply strict generator filter fix
        run: python .github/scripts/v18_2_filter_integrity.py

      - name: Validate browser JavaScript and filter integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/ntb.js').write_text(m.group(1), encoding='utf-8')
          required = [
              'V18 sponsor-and-affiliate-ready one-page build',
              "<meta name='impact-site-verification' value='9370d4fd-1b03-442a-844d-163db085d91f'>",
              'V18.2 strict generator filter integrity',
              'renderNoExactMatch()',
              'Your selected letter and origin will never be silently ignored.',
              'get_partner_offer',
              'partner_impression',
              'partner_click'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing V18.2 pieces: {missing}')
          if 'No exact match. Loosening the filters.' in text:
              raise SystemExit('Unsafe loose-filter fallback is still present')
          generate = re.search(r'function generate\(forceAny=false\)\{(.*?)\n\}', text, re.S)
          if not generate:
              raise SystemExit('generate() not found')
          if 'pool=names.filter' in generate.group(1):
              raise SystemExit('generate() still contains a broad fallback pool')
          PY
          node --check /tmp/ntb.js

      - name: Commit strict filter fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix generator filter integrity"
          git push
