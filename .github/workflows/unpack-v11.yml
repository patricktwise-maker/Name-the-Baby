name: V13 sponsor conversion tracking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sponsor_funnel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Instrument sponsor conversion funnel
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          changed = False

          old = 'document.querySelectorAll("[data-modal]").forEach(b=>b.addEventListener("click",()=>openModal(b.dataset.modal)));'
          new = '''document.querySelectorAll("[data-modal]").forEach(b=>b.addEventListener("click",()=>{\n  openModal(b.dataset.modal);\n  if(b.dataset.modal==="sponsorModal")logEvent("sponsor_opened",{source:b.id||"modal_trigger"});\n}));'''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          marker = 'async function copySponsorInquiry(){'
          if 'sponsorFormStarted=false' not in text and marker in text:
              insert = '''let sponsorFormStarted=false;\n["sCompany","sName","sEmail","sBudget","sNote"].forEach(id=>{\n  const el=$(id);\n  if(el)el.addEventListener("focus",()=>{\n    if(!sponsorFormStarted){sponsorFormStarted=true;logEvent("sponsor_form_started",{});}\n  },{once:true});\n});\n'''
              text = text.replace(marker, insert + marker, 1)
              changed = True

          old = '''$("sPackage").addEventListener("change",()=>{\n  $("packageSelected").textContent=`Selected partnership: ${$("sPackage").value}`;\n  $("packageSelected").classList.add("show");\n});'''
          new = '''$("sPackage").addEventListener("change",()=>{\n  const packageName=$("sPackage").value;\n  $("packageSelected").textContent=`Selected partnership: ${packageName}`;\n  $("packageSelected").classList.add("show");\n  logEvent("sponsor_package_interest",{package:packageName,source:"selector"});\n});'''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old = 'if(error){console.error(error);toast("Inquiry could not be sent");return;}'
          new = 'if(error){console.error(error);logEvent("sponsor_inquiry_error",{package:packageName});toast("Inquiry could not be sent");return;}'
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Sponsor funnel instrumentation applied.')
          else:
              print('Sponsor funnel instrumentation already present.')

      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', text, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          js = m.group(1)
          Path('/tmp/ntb.js').write_text(js, encoding='utf-8')
          required = ['sponsor_opened','sponsor_form_started','sponsor_package_interest','sponsor_inquiry_error','sponsor_inquiry']
          missing = [x for x in required if x not in js]
          if missing:
              raise SystemExit(f'Missing sponsor events: {missing}')
          PY
          node --check /tmp/ntb.js

      - name: Commit sponsor funnel tracking
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Track sponsor conversion funnel"
          git push
